<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Conversor accesible y responsive de temperaturas entre Celsius, Fahrenheit y Kelvin.">
  <meta name="theme-color" content="#155e75">
  <title>Conversor de Temperaturas</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <section class="converter-card" aria-labelledby="app-title">
      <header class="app-header">
        <div class="title-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" focusable="false">
            <path d="M26 10a8 8 0 0 1 16 0v25.3a14 14 0 1 1-16 0V10Z"/>
            <path class="mercury" d="M31 13a3 3 0 0 1 6 0v27.2a9 9 0 1 1-6 0V13Z"/>
          </svg>
        </div>
        <div>
          <h1 id="app-title">Conversor de Temperaturas</h1>
          <p>Ingresa un valor, elige las unidades y obtén la conversión al instante.</p>
        </div>
      </header>

      <form id="temperature-form" novalidate>
        <div class="field-group">
          <label for="temperature">Temperatura</label>
          <div class="input-wrapper">
            <input
              id="temperature"
              name="temperature"
              type="number"
              inputmode="decimal"
              step="any"
              autocomplete="off"
              placeholder="Ejemplo: 25"
              aria-describedby="temperature-help validation-message"
            >
            <span id="input-unit" class="input-unit" aria-hidden="true">°C</span>
          </div>
          <p id="temperature-help" class="field-help">Acepta números negativos y decimales.</p>
        </div>

        <div class="units-grid">
          <div class="field-group">
            <label for="from-unit">Unidad de origen</label>
            <select id="from-unit" name="from-unit" aria-label="Seleccionar unidad de origen">
              <option value="celsius">Celsius (°C)</option>
              <option value="fahrenheit">Fahrenheit (°F)</option>
              <option value="kelvin">Kelvin (K)</option>
            </select>
          </div>

          <button id="swap-button" class="icon-button swap-button" type="button" aria-label="Intercambiar unidades" title="Intercambiar unidades">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m7 7 3-3m-3 3 3 3M7 7h10a3 3 0 0 1 3 3v1M17 17l-3 3m3-3-3-3m3 3H7a3 3 0 0 1-3-3v-1"/>
            </svg>
          </button>

          <div class="field-group">
            <label for="to-unit">Unidad de destino</label>
            <select id="to-unit" name="to-unit" aria-label="Seleccionar unidad de destino">
              <option value="fahrenheit">Fahrenheit (°F)</option>
              <option value="celsius">Celsius (°C)</option>
              <option value="kelvin">Kelvin (K)</option>
            </select>
          </div>
        </div>

        <div id="validation-message" class="validation-message" role="alert" aria-live="assertive"></div>

        <section id="result-panel" class="result-panel is-empty" aria-labelledby="result-heading">
          <div class="result-copy">
            <p id="result-heading" class="eyebrow">Resultado</p>
            <output id="result" for="temperature from-unit to-unit" aria-live="polite">Ingresa una temperatura</output>
            <p id="formula-summary" class="formula-summary">La conversión aparecerá automáticamente.</p>
          </div>
          <div class="thermal-status" aria-label="Estado térmico">
            <span id="thermal-icon" class="thermal-icon" aria-hidden="true">◉</span>
            <strong id="thermal-label">Sin datos</strong>
          </div>
          <div class="thermal-meter" aria-hidden="true">
            <span id="thermal-indicator" class="thermal-indicator"></span>
          </div>
        </section>

        <div class="actions">
          <button id="clear-button" class="secondary-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 7h16M9 7V4h6v3m-9 0 1 13h10l1-13M10 11v5m4-5v5"/>
            </svg>
            Limpiar
          </button>
        </div>
      </form>

      <footer class="app-footer">
        <span aria-hidden="true">❄</span>
        <span>Conversión precisa, sin recargar la página</span>
        <span aria-hidden="true">☀</span>
      </footer>
    </section>
  </main>
</body>
</html>
